<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jax Repo</title>
<link rel="apple-touch-icon" href="CydiaIcon.png">
<style>
  :root { color-scheme: light dark; --bg: #f2f2f7; --card: #fff; --text: #1c1c1e; --muted: #6e6e73; --accent: #7a5cf0; --line: rgba(60,60,67,.18); }
  @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --muted: #98989f; --accent: #9d86ff; --line: rgba(84,84,88,.6); } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px 48px; }
  header { text-align: center; margin-bottom: 28px; }
  header img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { font-size: 28px; margin: 14px 0 2px; }
  .muted { color: var(--muted); }
  .url { margin: 14px auto 18px; font: 15px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); word-break: break-all; }
  .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .buttons a { flex: 1 1 160px; max-width: 220px; padding: 12px 16px; border-radius: 12px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  .buttons a.secondary { background: var(--card); color: var(--accent); }
  h2 { font-size: 13px; font-weight: 400; text-transform: uppercase; color: var(--muted); margin: 32px 16px 8px; }
  .list { background: var(--card); border-radius: 12px; overflow: hidden; }
  .package { display: flex; gap: 12px; align-items: center; padding: 12px 16px; }
  .package + .package { border-top: 0.5px solid var(--line); }
  .package .icon { width: 48px; height: 48px; border-radius: 11px; flex: none; }
  .package div.icon { background: var(--line); }
  .package .name { font-weight: 600; }
  .package .detail { font-size: 15px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="CydiaIcon.png" alt="">
    <h1>Jax Repo</h1>
    <div class="muted">Tweaks by alienjax</div>
    <div class="url" id="url"></div>
    <div class="buttons">
      <a id="sileo" href="#">Add to Sileo</a>
      <a id="zebra" class="secondary" href="#">Add to Zebra</a>
    </div>
  </header>
  <h2>Packages</h2>
  <div class="list" id="packages"><div class="package muted">Loading…</div></div>
</main>
<script>
  // The source's own address, whichever page of it this is opened from.
  const url = location.origin + location.pathname.replace(/[^/]*$/, "");
  document.getElementById("url").textContent = url;
  document.getElementById("sileo").href = "sileo://source/" + url;
  document.getElementById("zebra").href = "zbra://sources/add/" + url;

  // The newest version of each package, from the source's own index.
  fetch("Packages", { cache: "no-store" }).then(r => r.text()).then(text => {
    const newest = {};
    for (const stanza of text.trim().split(/\n\s*\n/)) {
      const fields = {};
      let key = null;
      for (const line of stanza.split("\n")) {
        if (/^\s/.test(line) && key) { fields[key] += "\n" + line.trim(); continue; }
        const i = line.indexOf(":");
        if (i > 0) { key = line.slice(0, i); fields[key] = line.slice(i + 1).trim(); }
      }
      const id = fields.Package;
      if (!id) continue;
      const older = newest[id];
      if (!older || older.Version.localeCompare(fields.Version, undefined, { numeric: true }) < 0) newest[id] = fields;
    }
    const list = document.getElementById("packages");
    list.textContent = "";
    for (const p of Object.values(newest).sort((a, b) => (a.Name || a.Package).localeCompare(b.Name || b.Package))) {
      const row = document.createElement("div");
      row.className = "package";
      // The package's own icon, or a plain placeholder when it has none.
      const placeholder = () => { const d = document.createElement("div"); d.className = "icon"; return d; };
      let icon = placeholder();
      if (p.Icon) {
        const img = document.createElement("img");
        img.className = "icon";
        img.alt = "";
        img.src = p.Icon.startsWith(url) ? p.Icon.slice(url.length) : p.Icon;
        img.onerror = () => img.replaceWith(placeholder());
        icon = img;
      }
      const info = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = (p.Name || p.Package) + "  " + p.Version;
      const detail = document.createElement("div");
      detail.className = "detail muted";
      detail.textContent = (p.Description || "").split("\n")[0];
      info.append(name, detail);
      row.append(icon, info);
      list.append(row);
    }
    if (!list.children.length) list.innerHTML = '<div class="package muted">No packages yet.</div>';
  }).catch(() => {
    document.getElementById("packages").innerHTML = '<div class="package muted">Couldn’t load the package list.</div>';
  });
</script>
</body>
</html>
